# Used by every integration test via @ActiveProfiles("test").
# In-memory H2 in MySQL mode, so tests never touch a real database.

# A fresh database name per Spring context, so cached contexts (e.g. one with
# the seeder enabled) never share or wipe each other's tables.
spring.datasource.url=jdbc:h2:mem:taskforge-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entities; Flyway migrations are MySQL
# SQL and are verified against a real MySQL instead (see README).
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Test-only secret (must be at least 32 characters for HS256)
jwt.secret=test-only-secret-key-never-used-outside-tests-1234567890
