spring.application.name=project-management-backend

# Active profile: dev (local, safe defaults) or prod (fail-fast, no secret fallbacks)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${PORT:6060}

# JWT expiration is safe to default anywhere; the *secret* is not (see per-profile files)
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JPA/Hibernate (shared) — dialect is auto-detected from the JDBC URL since
# Hibernate 6; MySQL8Dialect is deprecated and no longer needs to be set.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# AI features (task-description generation, project summaries) — leave blank
# to disable them entirely; AIService.isEnabled() lets the frontend hide the
# affordances rather than show a button that always 503s.
openai.api-key=${OPENAI_API_KEY:}

# Mail (shared; leave MAIL_USERNAME blank to disable reminder emails)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Logging
logging.level.root=WARN
logging.level.com.projectmgmttool.backend=INFO
logging.level.org.springframework.security=WARN

# Flyway — off by default (dev uses Hibernate ddl-auto=update for fast iteration),
# turned on explicitly in application-prod.properties where it owns the schema.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
