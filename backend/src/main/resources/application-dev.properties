# Local development only — safe, well-known defaults so `mvnw spring-boot:run` works
# out of the box against a local MySQL instance. NONE of these defaults are used
# in prod (see application-prod.properties, which has no fallbacks).

spring.datasource.url=jdbc:mysql://localhost:3306/projectmanagementdb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate manages the schema in dev for fast iteration; Flyway still runs
# alongside it to keep migration history in sync (validate happens in prod).
spring.jpa.hibernate.ddl-auto=update

# Known dev-only secret — fine locally, never used unless this profile is active.
jwt.secret=${JWT_SECRET:dev-only-T@skF0rge-Secret-Key-Never-Used-In-Prod-2026}
