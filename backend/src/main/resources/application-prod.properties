# Production — every value below is required from the environment.
# No fallback defaults on purpose: if JWT_SECRET, DB credentials, or the DB URL
# aren't set, the app must fail to start rather than silently run insecurely.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway migrations in prod — Hibernate only validates that
# the entities match what Flyway already applied. No auto-DDL against a live DB.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Must be a real, private secret injected via env — no fallback.
jwt.secret=${JWT_SECRET}
